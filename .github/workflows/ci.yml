# Tipos, tests de parsers y flujos clave en cada pull request.
name: CI

on:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run verificar
      - name: Recuperar los datos de la rama datos
        run: |
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0
          git ls-remote --exit-code --heads "$repo" datos > /dev/null || rc=$?
          case "$rc" in
            0) git clone --quiet --depth 1 --branch datos "$repo" data ;;
            2) git init --quiet -b datos data; git -C data remote add origin "$repo" ;;
            *) exit "$rc" ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
